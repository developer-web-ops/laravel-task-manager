services:
  # ── Web Service ───────────────────────────────────────────────
  - type: web
    name: taskflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/auth/login
    scaling:
      minInstances: 1
      maxInstances: 1

    envVars:
      - key: APP_NAME
        value: "Task Manager"

      - key: APP_ENV
        value: production

      - key: APP_KEY
        generateValue: true

      - key: APP_DEBUG
        value: "false"

      - key: APP_URL
        value: https://taskflow.onrender.com

      - key: APP_TIMEZONE
        value: Asia/Kolkata

      # Database — auto-linked to the PostgreSQL service below
      - key: DB_CONNECTION
        value: pgsql

      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString

      - key: CACHE_DRIVER
        value: database

      - key: SESSION_DRIVER
        value: database

      - key: QUEUE_CONNECTION
        value: sync

      - key: LOG_CHANNEL
        value: stderr

      # Mailtrap — email reminders
      - key: MAIL_MAILER
        value: smtp

      - key: MAIL_HOST
        value: sandbox.smtp.mailtrap.io

      - key: MAIL_PORT
        value: "2525"

      - key: MAIL_USERNAME
        value: 7bb65fc5384d73

      - key: MAIL_PASSWORD
        value: e47253e418f7cd

      - key: MAIL_ENCRYPTION
        value: tls

      - key: MAIL_FROM_ADDRESS
        value: noreply@taskmanager.com

      - key: MAIL_FROM_NAME
        value: "Task Manager"

  # ── PostgreSQL Database ───────────────────────────────────────
databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow
    plan: free
    region: singapore
