services:
  - type: web
    name: taskflow
    runtime: docker
    plan: free
    region: singapore
    branch: main

    dockerfilePath: ./Dockerfile
    dockerContext: .

    autoDeployTrigger: commit

    healthCheckPath: /api/health

    envVars:
      - key: APP_NAME
        value: "Task Manager"

      - key: APP_ENV
        value: production

      - key: APP_KEY
        generateValue: true

      - key: APP_DEBUG
        value: "false"

      # Render automatically provides the public URL.
      - key: APP_URL
        fromService:
          name: taskflow
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: APP_TIMEZONE
        value: Asia/Kolkata

      - key: APP_LOCALE
        value: en

      - key: APP_FALLBACK_LOCALE
        value: en

      - key: LOG_CHANNEL
        value: stderr

      - key: LOG_LEVEL
        value: info

      # Nginx listens on 8080.
      - key: PORT
        value: "8080"

      # Supabase PostgreSQL
      # Use Supabase Shared Pooler -> Session mode -> port 5432.
      - key: DB_CONNECTION
        value: pgsql

      - key: DB_URL
        sync: false

      - key: DB_SSLMODE
        value: require

      # Web sessions do not need PostgreSQL for this SPA/API architecture.
      - key: SESSION_DRIVER
        value: cookie

      - key: SESSION_LIFETIME
        value: "120"

      - key: SESSION_ENCRYPT
        value: "false"

      - key: SESSION_SECURE_COOKIE
        value: "true"

      - key: CACHE_STORE
        value: database

      - key: QUEUE_CONNECTION
        value: sync

      - key: FILESYSTEM_DISK
        value: local

      # Laravel Passport
      - key: PASSPORT_PRIVATE_KEY
        sync: false

      - key: PASSPORT_PUBLIC_KEY
        sync: false

      # Mailtrap
      - key: MAIL_MAILER
        value: smtp

      - key: MAIL_SCHEME
        value: tls

      - key: MAIL_HOST
        value: sandbox.smtp.mailtrap.io

      - key: MAIL_PORT
        value: "2525"

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_FROM_ADDRESS
        value: noreply@taskmanager.com

      - key: MAIL_FROM_NAME
        value: "Task Manager"